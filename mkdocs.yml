      - ৩.৪. শুরুর ধারণা - ডাটা নিয়ে: introduction/why-data.md
      - ৩.৫. ডাটার তত্ব আর তার প্রসেস: introduction/principles-data.md
      - ৩.৬. কিভাবে শিখবেন?: introduction/how-to-learn.md
