site_name: 'হাতেকলমে মেশিন লার্নিং: টাইটানিক প্রজেক্ট'
site_url: https://aiwithr.github.io/mlbook-titanic/
repo_url: https://github.com/aiwithr/mlbook-titanic
repo_name: aiwithr/mlbook-titanic
site_author: Rakibul Hassan (রকিবুল হাসান)
site_description: হাতেকলমে মেশিন লার্নিং (আর এবং পাইথন প্রোগ্রামিং এনভায়রনমেন্ট) -
  টাইটানিক প্রজেক্ট। By Rakibul Hassan (রকিবুল হাসান)।
copyright: সৃজনশীল লাইসেন্সিং &copy; Rakibul Hassan (রকিবুল হাসান) &middot; <a href='https://aiwithr.github.io/'>aiwithr.github.io</a>
edit_uri: ''
theme:
  name: material
  custom_dir: overrides
  language: bn
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font: false
  features:
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - navigation.footer
  include_search_page: true
  search_index_only: true
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mermaid-loader.js
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/raqueeb/mltraining
      name: Companion Codebase (raqueeb/mltraining)
    - icon: fontawesome/brands/git-alt
      link: https://github.com/aiwithr/mlbook-titanic
      name: Book Source Repository (aiwithr/mlbook-titanic)
    - icon: fontawesome/brands/medium
      link: https://medium.com/@raqueeb
    - icon: fontawesome/brands/facebook-messenger
      link: http://m.me/raqueeb
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/raqueeb
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/raqueeb/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@raqueeb
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - হোম: index.md
  - ভূমিকা ও প্রারম্ভিক:
      - উৎসর্গ: dedication.md
      - প্রথম পাতা: intro.md
      - মুখবন্ধ: forward.md
      - কৃতজ্ঞতা: courtesy.md
      - কাদের জন্য বইটা?: target-audience.md
      - কাদের জন্য নয়: who-is-not-intended-to.md
      - কিভাবে পড়বেন বইটা?: how-to-use-this-book.md
  - 'পর্ব ১: পাল্টে যাবার ঘটনা':
      - 'পর্ব ১: পাল্টে যাবার ঘটনা': changing-world/index.md
      - ১.১. সিডিসি’র ওয়ার্নিং: changing-world/ccd-warning.md
      - ১.২. ইন্টারকানেকশন কস্ট মডেলিং: changing-world/interconnection-cost-modeling.md
      - ১.৩. মানুষের পাশে ডাটা: changing-world/cdr-metadata.md
      - ১.৪. গুগল ফটোজ, টেক্সট টু স্পিচ: changing-world/google-photos.md
      - ১.৫. সরকারি ওপেন ডাটা: changing-world/govt-open-data.md
      - ১.৬ প্রাইভেট সেক্টর + পাবলিক সেক্টর (ডাটা শেয়ারিং): changing-world/social-media.md
      - ১.৭. আর্টিফিসিয়াল ইন্টেলিজেন্স - মেশিন লার্নিংএর প্রসার: changing-world/ai-industry.md
      - ১.৮. মেশিন লার্নিং ব্যবহারে এগিয়ে যে ইন্ডাস্ট্রিগুলো: changing-world/machine-learning-industry.md
  - 'পর্ব ২: ডাটা থেকে ভবিষ্যৎ দেখার ধারণা':
      - 'পর্ব ২: ডাটা থেকে ভবিষ্যৎ দেখার ধারণা': seeing-the-future/index.md
      - ২.১. মেশিন লার্নিং হ্যাক: seeing-the-future/hack.md
      - ২.২. ভবিষ্যৎ দেখার ধারণা + ডাটার গল্প বলার ক্ষমতা: seeing-the-future/seeing-future.md
      - ২.৩. মৃত্যু অ্যালগরিদম: seeing-the-future/death-algo.md
      - ২.৪. দেশের নীতিনির্ধারণী ড্যাশবোর্ড: seeing-the-future/government-dashboard.md
  - 'পর্ব ৩: মেশিন লার্নিং কি? (৩০ মিনিট)':
      - 'পর্ব ৩: মেশিন লার্নিং কি? (৩০ মিনিট)': introduction/index.md
      - ৩.১. মেশিন লার্নিং জিনিসটা কি?: introduction/what-is-ml.md
      - ৩.২. কেন দরকার মেশিন লার্নিং?: introduction/why-needed.md
